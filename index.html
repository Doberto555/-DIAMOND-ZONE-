<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIAMOND ZONE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HERO SECTION -->
<section class="hero">
  <h1 class="logo">💎 DIAMOND ZONE</h1>
  <p class="tag">TOP UP FREE FIRE • RAPIDE • SÉCURISÉ</p>
  <button onclick="scrollToOrder()" class="cta">COMMENCER</button>
</section>

<!-- FORM -->
<section class="section" id="order">
  <h2>🎮 Commander</h2>

  <input type="text" id="playerId" placeholder="Entre ton ID Free Fire">

  <select id="diamonds">
    <option value="">Choisir un pack</option>
    <option value="100 Diamonds">100 Diamonds - 150 HTG</option>
    <option value="310 Diamonds">310 Diamonds - 400 HTG</option>
    <option value="520 Diamonds">520 Diamonds - 650 HTG</option>
    <option value="1060 Diamonds">1060 Diamonds - 1300 HTG</option>
  </select>

  <button onclick="orderWhatsApp()">Commander via WhatsApp</button>
</section>

<!-- FEATURES -->
<section class="features">
  <div class="card">⚡ Livraison rapide</div>
  <div class="card">💰 Paiement MonCash</div>
  <div class="card">📱 Support WhatsApp</div>
</section>

<footer>
  © 2026 DIAMOND ZONE
</footer>

<script src="script.js"></script>
</body>
</html>
